name: Build VoiceTuT-TTS image

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/voicetut-tts/**"
      - ".github/workflows/build-voicetut-tts.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/voicetut-tts
          file: docker/voicetut-tts/Dockerfile
          push: true
          tags: |
            ghcr.io/muhfares/voicetut-tts:latest
            ghcr.io/muhfares/voicetut-tts:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test handler on CPU (print real traceback)
        continue-on-error: true
        run: |
          docker run --rm ghcr.io/muhfares/voicetut-tts:latest python -u -c "
          import sys; sys.path.insert(0, '/')
          import handler, json
          result = handler.handler({'input': {'text': 'اختبار سريع للصوت', 'voice': 'Mohamed'}})
          out = dict(result)
          if 'audio' in out: out['audio'] = out['audio'][:60] + '...'
          print('HANDLER_RESULT:', out)
          if 'audio' in result:
              import base64
              buf = base64.b64decode(result['audio'])
              print('bytes', len(buf), 'header', buf[0:4])
          "
