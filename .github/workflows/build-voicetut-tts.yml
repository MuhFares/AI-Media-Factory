name: Build VoiceTuT-TTS image

on:
  workflow_dispatch:
  push:
    paths:
      - "docker/voicetut-tts/**"
      - ".github/workflows/build-voicetut-tts.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/voicetut-tts
          file: docker/voicetut-tts/Dockerfile
          push: true
          tags: |
            ghcr.io/muhfares/voicetut-tts:latest
            ghcr.io/muhfares/voicetut-tts:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max
