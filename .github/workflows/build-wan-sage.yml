name: Build Wan2.2 SageAttention image

on:
  workflow_dispatch:
  push:
    paths:
      - "experimental/wan2.2-sageattention/**"
      - ".github/workflows/build-wan-sage.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: experimental/wan2.2-sageattention/Dockerfile
          push: true
          tags: ghcr.io/muhfares/wan2.2-sageattention:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
